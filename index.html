<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Paskamer Praat — de community van DoubleYou voor tall & plus size fashion. Deel je verhaal, verdien DSP punten.">
  <meta name="theme-color" content="#c67d06">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Paskamer">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Open Graph -->
  <meta property="og:title" content="Paskamer Praat — DoubleYou">
  <meta property="og:description" content="Community voor tall & plus size fashion. Deel je verhaal, verdien DSP punten.">
  <meta property="og:type" content="website">

  <title>Paskamer Praat — DoubleYou</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Install banner (verborgen tot prompt beschikbaar is) -->
  <div id="dy-install-banner" class="dy-install-banner" style="display:none">
    <span class="dy-install-tekst">📱 Voeg Paskamer Praat toe aan je startscherm</span>
    <button class="dy-install-btn" id="btn-install">Installeren</button>
    <button class="dy-install-sluiten" id="btn-install-sluiten">&times;</button>
  </div>

  <!-- Topbar -->
  <div class="dy-topbar">
    <div>
      <div class="dy-topbar-brand">DoubleYou</div>
      <div class="dy-topbar-sub">Paskamer Praat</div>
    </div>
    <div class="dy-topbar-right">
      <div class="dy-topbar-avatar" id="dy-topbar-avatar" onclick="DY.navigeer('profiel')" style="display:none"></div>
    </div>
  </div>

  <!-- Hoofdinhoud -->
  <main id="dy-main" class="dy-main">
    <div class="dy-loader">
      <div class="dy-spinner"></div>
    </div>
  </main>

  <!-- Bottom navigatie -->
  <nav class="dy-nav" id="dy-nav">
    <button class="dy-nav-item active" data-pagina="feed" onclick="DY.navigeer('feed')">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      <span>Feed</span>
    </button>
    <button class="dy-nav-item" data-pagina="nieuw" onclick="DY.navigeer('nieuw')">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>Schrijven</span>
    </button>
    <button class="dy-nav-item" data-pagina="dsp" onclick="DY.navigeer('dsp')">
      <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/></svg>
      <span>DSP</span>
    </button>
    <button class="dy-nav-item" data-pagina="profiel" onclick="DY.navigeer('profiel')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profiel</span>
    </button>
  </nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- App scripts -->
  <script>window.DY = {};</script>
  <script src="js/dsp.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Auth state → topbar avatar bijwerken
    firebase.auth().onAuthStateChanged(function(user) {
      const avatar = document.getElementById('dy-topbar-avatar');
      if (user) {
        const naam = user.displayName || user.email || '?';
        avatar.textContent = naam.slice(0,2).toUpperCase();
        avatar.style.display = 'flex';
      } else {
        avatar.style.display = 'none';
      }
    });

    // PWA install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('dy-install-banner');
      if (!localStorage.getItem('dy_install_dismissed')) {
        banner.style.display = 'flex';
      }
    });

    document.getElementById('btn-install').onclick = function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(result) {
          document.getElementById('dy-install-banner').style.display = 'none';
          deferredPrompt = null;
        });
      }
    };

    document.getElementById('btn-install-sluiten').onclick = function() {
      document.getElementById('dy-install-banner').style.display = 'none';
      localStorage.setItem('dy_install_dismissed', '1');
    };
  </script>

</body>
</html>
