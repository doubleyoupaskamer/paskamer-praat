  <!-- Cache recovery - als de app niet binnen 8s laadt, toon een
       'Forceer vernieuwen' knop die alle SW caches wist en herlaadt.
       Voorkomt dat iOS PWA gebruikers vastlopen op oude cache. -->
  <script>
  (function() {
    var STUCK_MS = 8000;
    var timer = setTimeout(function() {
      // Is de app daadwerkelijk geladen?
      if (window.DY && (window.DY.user !== undefined || document.querySelector('.dy-reel-content'))) return;
      var div = document.createElement('div');
      div.setAttribute('role', 'alertdialog');
      div.style.cssText = 'position:fixed;inset:0;background:#1e1a0f;color:#fefcf5;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:DM Sans,Inter,system-ui,sans-serif;text-align:center;line-height:1.6';
      div.innerHTML =
        '<h2 style="margin:0 0 12px;font-size:22px;font-weight:700;letter-spacing:-0.01em">App laadt niet?</h2>' +
        '<p style="margin:0 0 24px;max-width:320px;opacity:.85;font-size:15px">Dit komt door een oude cache op je toestel. Tik op de knop om de app helemaal te verversen.</p>' +
        '<button type="button" id="dy-force-reload" style="background:#fefcf5;color:#1e1a0f;border:none;padding:14px 28px;border-radius:999px;font:600 15px DM Sans,Inter,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation">Forceer vernieuwen</button>' +
        '<button type="button" id="dy-cancel-reload" style="background:transparent;color:#fefcf5;border:none;padding:12px;margin-top:8px;font:400 13px DM Sans,Inter,sans-serif;cursor:pointer;opacity:.6">Nog even wachten</button>';
      document.body.appendChild(div);
      div.querySelector('#dy-force-reload').onclick = function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).then(function() {
              return caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              });
            }).then(function() {
              window.location.replace(window.location.pathname + '?reset=' + Date.now());
            });
          } else {
            window.location.reload(true);
          }
        } catch (e) { window.location.reload(true); }
      };
      div.querySelector('#dy-cancel-reload').onclick = function() { div.remove(); };
    }, STUCK_MS);
    // Als app wel laadt: cancel de fallback
    var probe = setInterval(function() {
      if (window.DY && (window.DY.user !== undefined || document.querySelector('.dy-reel-content'))) {
        clearTimeout(timer);
        clearInterval(probe);
      }
    }, 500);
  })();
  </script>

  <!-- PWA Install - mobiele startscherm prompt - v60.1 bulletproof detection -->
  <script>
  (function() {
    var ua = navigator.userAgent || '';
    var isIOS     = /iphone|ipad|ipod/i.test(ua) && !window.MSStream;
    var isAndroid = /android/i.test(ua);
    var isMobile  = isIOS || isAndroid || (/Mobi/i.test(ua) && window.innerWidth <= 900);
    var DISMISS   = 'dy_install_v3';
    var SESSION   = 'dy_install_sess_v3';
    var dPrompt   = null;

    // ── v60.1: Comprehensive standalone detection voor iOS/Android/Samsung/Desktop ──
    // Samsung Internet rapporteert geïnstalleerde PWA's vaak als 'minimal-ui' of
    // 'fullscreen' i.p.v. 'standalone'. Manifest gebruikt display_override
    // ["standalone","minimal-ui"], dus we moeten beide accepteren.
    function isAppInstalled() {
      try {
        if (window.matchMedia('(display-mode: standalone)').matches) return true;
        if (window.matchMedia('(display-mode: minimal-ui)').matches) return true;
        if (window.matchMedia('(display-mode: fullscreen)').matches) return true;
        if (window.matchMedia('(display-mode: window-controls-overlay)').matches) return true;
      } catch(e) {}
      if (window.navigator && window.navigator.standalone === true) return true; // iOS Safari
      // Android TWA / WebAPK / Samsung Internet referrer-detectie
      try {
        if (document.referrer && document.referrer.indexOf('android-app://') === 0) return true;
      } catch(e) {}
      // Fallback: eerder gedetecteerd installed → blijf banner verbergen
      try {
        if (localStorage.getItem('dy_pwa_geinstalleerd') === '1') return true;
      } catch(e) {}
      return false;
    }
    // Expose voor andere scripts (a2hs-prompt-v1.js gebruikt dezelfde check)
    window.DY = window.DY || {};
    window.DY.isAppInstalled = isAppInstalled;

    // Wanneer standalone gedetecteerd: zet PERMANENT dismiss flag zodat
    // banner ook nooit meer terugkomt als detectie tijdelijk faalt
    // (bv. Samsung Internet die display-mode kortstondig fout rapporteert).
    function markAlsGeinstalleerd() {
      try {
        localStorage.setItem('dy_pwa_geinstalleerd', '1');
        localStorage.setItem(DISMISS, '1');
      } catch(e) {}
    }
    if (isAppInstalled()) markAlsGeinstalleerd();

    // Niet tonen in standalone/PWA mode
    if (isAppInstalled()) return;
    // Niet tonen op desktop
    if (!isMobile) return;
    // Niet tonen als permanent dismissed
    try { if (localStorage.getItem(DISMISS)) return; } catch(e) {}
    // Niet tonen als deze sessie al gesloten
    try { if (sessionStorage.getItem(SESSION)) return; } catch(e) {}

    function showBanner() {
      try {
        // Nogmaals checken - beforeinstallprompt kan inmiddels niet gefired hebben
        // omdat app daadwerkelijk al geïnstalleerd is.
        if (isAppInstalled()) { markAlsGeinstalleerd(); return; }
        if (localStorage.getItem(DISMISS)) return;
        if (sessionStorage.getItem(SESSION)) return;
        // v60.1.110 dedupe: niet tonen als de a2hs bottom-sheet al actief is.
        // Voorkomt dubbele "Installeer/Toevoegen" knoppen op het scherm.
        if (document.getElementById('dy-a2hs-prompt')) return;
      } catch(e) {}

      var b = document.getElementById('dy-install-banner');
      if (!b) return;

      // iOS: pas tekst aan
      if (isIOS) {
        var span = b.querySelector('.dy-install-tekst span');
        if (span) span.textContent = 'Tik op Deel → Zet op beginscherm';
        var btn = document.getElementById('btn-install');
        if (btn) btn.textContent = 'Hoe?';
      }

      // Toon direct - geen complexe display/opacity dance
      b.style.display = 'flex';
      b.style.opacity = '0';
      b.style.transition = 'opacity 0.4s ease';
      // Force reflow
      void b.offsetWidth;
      b.style.opacity = '1';
      b.classList.add('dy-install-slide-in');
    }

    function hideBanner(permanent) {
      var b = document.getElementById('dy-install-banner');
      if (b) { b.style.opacity = '0'; setTimeout(function(){ b.style.display='none'; }, 400); }
      try {
        if (permanent) localStorage.setItem(DISMISS, '1');
        else sessionStorage.setItem(SESSION, '1');
      } catch(e) {}
    }

    // Android beforeinstallprompt
    window.addEventListener('beforeinstallprompt', function(e) {
      // v60.1: als app al geïnstalleerd is, NEGEER de event en verberg banner
      if (isAppInstalled()) {
        markAlsGeinstalleerd();
        hideBanner(true);
        return;
      }
      e.preventDefault();
      dPrompt = e;
    });
    window.addEventListener('appinstalled', function() {
      markAlsGeinstalleerd();
      hideBanner(true);
      // Track installatie in Firestore
      if (window.DY && typeof DY.trackPWAEvent === 'function') {
        DY.trackPWAEvent('installed');
      }
    });

    // v60.1: live-detectie van display-mode wijziging (bv. user opent PWA na install)
    try {
      var _mq = window.matchMedia('(display-mode: standalone)');
      var _onModeChange = function() {
        if (isAppInstalled()) {
          markAlsGeinstalleerd();
          hideBanner(true);
        }
      };
      if (_mq.addEventListener) _mq.addEventListener('change', _onModeChange);
      else if (_mq.addListener) _mq.addListener(_onModeChange); // legacy Safari
    } catch(e) {}

    // Toon na 15 seconden - ALLEEN na voltooide eerste sessie
    var SESSION_FLAG = 'dy_first_session_done';
    function _startInstallTimer() {
      try { if (!localStorage.getItem(SESSION_FLAG)) return; } catch(e) { return; }
      setTimeout(showBanner, 15000);
    }
    // Direct controleren (terugkerende bezoeker die al eerste sessie had)
    _startInstallTimer();
    // Luisteren naar signaal van app-final.js (nieuwe sessie voltooiing)
    window.addEventListener('dy:first-session-done', function() {
      _startInstallTimer();
    });

    // ── v60.1 iOS fix: bind knop-handlers DIRECT, niet pas op DOMContentLoaded.
    // Inline script staat na de banner-DOM, dus elementen bestaan al.
    // Vorige binding via DOMContentLoaded had race condition op iOS Safari
    // waardoor de "Hoe?" / "Toevoegen" knop soms niet reageerde.
    function bindKnoppen() {
      var btnI = document.getElementById('btn-install');
      var btnS = document.getElementById('btn-install-sluiten');
      if (btnI && !btnI._dyBound) {
        btnI._dyBound = true;
        var handler = function(ev) {
          try { if (ev && ev.preventDefault) ev.preventDefault(); } catch(_){}
          if (dPrompt) {
            try {
              dPrompt.prompt();
              dPrompt.userChoice.then(function(c) {
                if (c && c.outcome === 'accepted') markAlsGeinstalleerd();
                hideBanner(true);
                dPrompt = null;
              }).catch(function() { hideBanner(false); });
            } catch(e) { hideBanner(false); }
          } else if (isIOS) {
            // iOS heeft geen programmatic install - toon instructies
            try {
              alert('Tik op het Deel-icoon onderin (vierkantje met pijl) en kies "Zet op beginscherm".');
            } catch(e) {}
          } else {
            hideBanner(false);
          }
        };
        btnI.addEventListener('click', handler);
        // iOS Safari extra: touchend voor snellere respons (geen 300ms delay)
        btnI.addEventListener('touchend', function(ev) {
          // Voorkom dubbele fire wanneer click óók fired
          if (ev.cancelable) { try { ev.preventDefault(); } catch(_){} }
          handler(ev);
        }, { passive: false });
      }
      if (btnS && !btnS._dyBound) {
        btnS._dyBound = true;
        var sluitHandler = function(ev) {
          try { if (ev && ev.preventDefault) ev.preventDefault(); } catch(_){}
          hideBanner(false);
        };
        btnS.addEventListener('click', sluitHandler);
        btnS.addEventListener('touchend', function(ev) {
          if (ev.cancelable) { try { ev.preventDefault(); } catch(_){} }
          sluitHandler(ev);
        }, { passive: false });
      }
    }
    // Bind direct als de banner-DOM al bestaat (inline script staat na de banner)
    if (document.getElementById('btn-install')) {
      bindKnoppen();
    } else if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bindKnoppen);
    } else {
      bindKnoppen();
    }

  })();

  // PWA removal detectie: als eerder geïnstalleerd maar nu geen standalone meer
  (function() {
    var wasInstalled = null;
    try { wasInstalled = localStorage.getItem('dy_install_v3'); } catch(e) {}
    // v60.1: gebruik dezelfde robuuste detectie als hierboven
    var isStandalone = (window.DY && typeof window.DY.isAppInstalled === 'function')
      ? window.DY.isAppInstalled()
      : (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone);
    if (wasInstalled && !isStandalone) {
      var lastCheck = null;
      try { lastCheck = localStorage.getItem('dy_pwa_last_check'); } catch(e) {}
      var now = Date.now();
      if (lastCheck && (now - parseInt(lastCheck)) > 3600000) {
        setTimeout(function() {
          // Nogmaals controleren - kan zijn dat display-mode kortstondig fout was
          var stillNotStandalone = !(window.DY && typeof window.DY.isAppInstalled === 'function'
            ? window.DY.isAppInstalled()
            : (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone));
          if (!stillNotStandalone) return;
          if (window.DY && typeof DY.trackPWAEvent === 'function') {
            DY.trackPWAEvent('removed');
            try {
              localStorage.removeItem('dy_install_v3');
              localStorage.removeItem('dy_pwa_geinstalleerd');
            } catch(e) {}
          }
        }, 5000);
      }
    }
    try { localStorage.setItem('dy_pwa_last_check', Date.now().toString()); } catch(e) {}
  })();
  </script>
